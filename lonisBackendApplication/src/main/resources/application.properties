spring.application.name=lonisBackendApplication

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JPA / Hibernate
spring.jpa.open-in-view=false
# Changer validate en none pour ne pas vérifier la structure
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=false

# Server
server.port=${SERVER_PORT:9090}

# Actuator
management.endpoints.web.exposure.include=health,info

# API Key (header X-API-Key) — surchargeable via env LONIS_API_KEY
#lonis.security.api-key=
#lonis.security.api-key=${LONIS_API_KEY:dev-change-me}
lonis.security.api-key=${LONIS_API_KEY:L0NIS@2607}

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html